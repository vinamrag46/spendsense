<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendSense</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e6e6; line-height: 1.6; padding: 32px 20px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: #8a8f98; font-size: 14px; margin-bottom: 28px; }
  .card {
    background: #171a21; border: 1px solid #262b35; border-radius: 10px;
    padding: 20px; margin-bottom: 18px;
  }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #c9cdd4; }
  input[type=text], input[type=file] {
    width: 100%; padding: 10px 12px; background: #0f1115; color: #e6e6e6;
    border: 1px solid #2d333f; border-radius: 6px; font-size: 14px;
  }
  button {
    padding: 10px 18px; background: #4f7cff; color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 10px;
  }
  button:hover { background: #3d67e0; }
  button.ghost { background: #262b35; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row input { flex: 1; }
  .row button { margin-top: 0; }
  .result {
    margin-top: 14px; padding: 12px 14px; background: #0f1115;
    border-left: 3px solid #4f7cff; border-radius: 0 6px 6px 0; font-size: 14px;
  }
  .cat { font-weight: 600; color: #7fa2ff; text-transform: capitalize; }
  .conf { color: #8a8f98; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: #0f1115; border: 1px solid #262b35; border-radius: 8px; padding: 14px; }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .l { font-size: 12px; color: #8a8f98; text-transform: uppercase; letter-spacing: .5px; }
  .bar-row { margin-bottom: 12px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-top .name { text-transform: capitalize; }
  .bar-bg { height: 8px; background: #262b35; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #4f7cff; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #8a8f98; font-weight: 500; padding: 8px 6px;
       border-bottom: 1px solid #262b35; font-size: 12px; text-transform: uppercase; }
  td { padding: 9px 6px; border-bottom: 1px solid #1c202a; }
  .pill { display: inline-block; padding: 2px 9px; background: #232a3a; color: #7fa2ff;
          border-radius: 20px; font-size: 12px; text-transform: capitalize; }
  .muted { color: #6b7280; font-size: 13px; }
  .low { color: #e0a458; }
</style>
</head>
<body>
<div class="wrap">

  <h1>SpendSense</h1>
  <p class="sub">Transactions sorted into categories by a trained model.</p>

  <div class="card">
    <h2>Try one transaction</h2>
    <div class="row">
      <input type="text" id="tryText" placeholder="e.g. Swiggy order INR 480 TXN9a21">
      <button onclick="tryOne()">Categorise</button>
    </div>
    <div id="tryResult"></div>
  </div>

  <div class="card">
    <h2>Upload a statement</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button onclick="uploadCsv()">Upload and categorise</button>
    <button class="ghost" onclick="clearAll()">Clear all data</button>
    <div id="uploadResult"></div>
  </div>

  <div class="card">
    <h2>Where your money went</h2>
    <div class="stats" id="stats"></div>
    <div id="bars" style="margin-top:20px"></div>
  </div>

  <div class="card">
    <h2>Recent transactions</h2>
    <div id="txnList"><p class="muted">Nothing yet.</p></div>
  </div>

</div>

<script>
async function tryOne() {
  const text = document.getElementById('tryText').value.trim();
  if (!text) return;
  const res = await fetch('/api/predict', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({description: text})
  });
  const d = await res.json();
  const pct = (d.confidence * 100).toFixed(0);
  const warn = d.confidence < 0.5 ? ' <span class="low">(model is unsure)</span>' : '';
  document.getElementById('tryResult').innerHTML =
    `<div class="result">This looks like <span class="cat">${d.category}</span>
     <span class="conf">— ${pct}% confident${warn}</span></div>`;
}

async function uploadCsv() {
  const input = document.getElementById('csvFile');
  if (!input.files.length) return;
  const form = new FormData();
  form.append('file', input.files[0]);
  const res = await fetch('/api/upload', {method: 'POST', body: form});
  const d = await res.json();
  document.getElementById('uploadResult').innerHTML = d.error
    ? `<div class="result">${d.error}</div>`
    : `<div class="result">Saved ${d.saved} transactions (read column "${d.used_column}")</div>`;
  refresh();
}

async function clearAll() {
  await fetch('/api/transactions', {method: 'DELETE'});
  refresh();
}

async function refresh() {
  const s = await (await fetch('/api/summary')).json();

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${s.total_transactions}</div><div class="l">Transactions</div></div>
    <div class="stat"><div class="n">₹${Math.round(s.total_spend).toLocaleString('en-IN')}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${s.by_category.length}</div><div class="l">Categories</div></div>`;

  const max = Math.max(...s.by_category.map(c => c.total), 1);
  document.getElementById('bars').innerHTML = s.by_category.map(c => `
    <div class="bar-row">
      <div class="bar-top">
        <span class="name">${c.category} <span class="muted">(${c.count})</span></span>
        <span>₹${Math.round(c.total).toLocaleString('en-IN')}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${c.total/max*100}%"></div></div>
    </div>`).join('') || '<p class="muted">Upload something to see this.</p>';

  const t = await (await fetch('/api/transactions?limit=25')).json();
  document.getElementById('txnList').innerHTML = t.transactions.length ? `
    <table><thead><tr><th>Description</th><th>Category</th><th>Confidence</th><th>Amount</th></tr></thead>
    <tbody>${t.transactions.map(x => `
      <tr>
        <td>${x.description}</td>
        <td><span class="pill">${x.category}</span></td>
        <td class="${x.confidence < 0.5 ? 'low' : 'muted'}">${(x.confidence*100).toFixed(0)}%</td>
        <td>₹${Math.round(x.amount).toLocaleString('en-IN')}</td>
      </tr>`).join('')}</tbody></table>`
    : '<p class="muted">Nothing yet.</p>';
}

document.getElementById('tryText').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryOne();
});

refresh();
</script>
</body>
</html>
